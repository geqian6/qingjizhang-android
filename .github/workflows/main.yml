name: 编译 APK

on:
  push:
    branches: [ main, master ]
    # 日志回写仓库时不再触发新一轮编译，避免死循环
    paths-ignore:
      - 'build-error.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # set -o pipefail 是必须的：
      # 没有它，`gradle ... | tee build.log` 的退出码取自 tee（永远是 0），
      # gradle 明明挂了这一步也会被判成「成功」，后面的失败判断全部失效。
      - name: 编译 Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      # 无论成功失败都把日志整理一份提交回仓库。
      # 原因：GitHub 的 Actions 日志接口要求登录，外部读不到；
      # 写进仓库后，这个公开仓库的日志谁都能读到，不用再靠截图。
      - name: 把编译日志写回仓库
        if: always()
        run: |
          touch build.log
          {
            echo "===== 运行信息 ====="
            echo "run_number : ${GITHUB_RUN_NUMBER}"
            echo "commit     : ${GITHUB_SHA}"
            echo "时间(UTC)  : $(date -u)"
            echo
            echo "===== Gradle / Java 版本 ====="
            gradle --version 2>&1 || true
            java -version 2>&1 || true
            echo
            echo "===== APK 产物目录 ====="
            ls -la app/build/outputs/apk/debug/ 2>&1 || echo "（没有产物目录）"
            echo
            echo "===== 报错相关行（含上下文） ====="
            grep -nE -B 3 -A 12 'e: file|e: |error:|FAILURE:|What went wrong|FAILED|Could not resolve|Could not find|Unresolved reference|Caused by:|Execution failed|BUILD FAILED|AAPT|requires|Duplicate class' build.log 2>&1 | head -n 400 || true
            echo
            echo "===== 日志尾部 300 行 ====="
            tail -n 300 build.log 2>&1 || true
          } > build-error.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-error.log
          git commit -m "记录编译日志 [skip ci]" || true
          git push || true

      - name: 上传 APK（构建产物，备用）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qingjizhang-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 这一步是为了「手机上点一下就能装」：
      # 构建产物要下 zip 再解压，手机不好操作；挂到 Release 上就能直接点 APK 下载。
      - name: 发到 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la app/build/outputs/apk/debug/
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "轻记账 v0.1.0 · 构建 ${GITHUB_RUN_NUMBER}" \
            --notes "在手机浏览器打开本页，点下面的 app-debug.apk 直接下载安装。

          这是 debug 版（未签名发布版），安装时系统会提示「未知来源」或「禁止安装未知应用」，允许即可。"
